[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-shield"
version = "0.1.0"
description = "Offline synthetic MCP metadata risk inspection with explainable classical ML"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
mcp-shield = "mcp_shield.cli:main"

[tool.setuptools.package-data]
mcp_shield = ["dashboard.html"]
